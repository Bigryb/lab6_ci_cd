name: "LR6 - basic Bandit SAST"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit-scan:
    name: "Bandit Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Bandit and generate JSON
        run: |
          mkdir -p reports
          bandit -r app \
            -f json \
            -o reports/bandit.json \
            --exit-zero

      - name: Show vulnerabilities in logs
        run: bandit -r app --exit-zero

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: reports/bandit.json
          if-no-files-found: warn
          retention-days: 7
